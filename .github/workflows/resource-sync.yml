name: Sync PS2 ecosystem resources

on:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ps2sp-catalog-write
  cancel-in-progress: false

jobs:
  sync-resources:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out catalog
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Synchronize PS2Links directory
        run: npm run resources:sync

      - name: Validate site
        run: npm run build

      - name: Commit resource changes
        run: |
          if [ -z "$(git status --porcelain -- data/resources/ps2links.json)" ]; then
            echo "Resource registry already current."
            exit 0
          fi
          git config user.name "ps2sp-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/resources/ps2links.json
          git commit -m "chore(resources): synchronize PS2Links directory"
          git pull --rebase origin main
          git push
