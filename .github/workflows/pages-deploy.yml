name: Batch Cloudflare Pages deploys

on:
  schedule:
    - cron: "22 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ps2sp-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'johnson-cooper/PS2SP'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Trigger one batched Pages build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ps2sp-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Pull immediately before creating the trigger commit so the Pages
          # deployment always builds the newest automated catalog snapshot.
          git pull --rebase origin main
          git commit --allow-empty -m "chore(deploy): publish batched PS2SP updates"
          git push origin HEAD:main
