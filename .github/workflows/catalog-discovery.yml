name: Discover PS2 projects

on:
  schedule:
    - cron: "47 */2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/discover-github.mjs"
      - "scripts/promote-pending.mjs"
      - "package.json"
      - "config/discovery-sources.json"
      - ".github/workflows/catalog-discovery.yml"

permissions:
  contents: write

concurrency:
  group: ps2sp-catalog-write
  cancel-in-progress: false

jobs:
  discover:
    if: github.repository == 'johnson-cooper/PS2SP'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out catalog
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Discover and recheck PS2 projects
        env:
          GITHUB_TOKEN: ${{ secrets.PS2SP_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          MAX_DISCOVERY_API_REQUESTS: "350"
          GITHUB_CORE_RATE_LIMIT_RESERVE: "120"
          GITHUB_SEARCH_RATE_LIMIT_RESERVE: "2"
          GITHUB_SEARCH_DELAY_MS: "2100"
          BOOTSTRAP_MONTHS_PER_RUN: "6"
          BOOTSTRAP_SEARCH_PAGES: "3"
          INCREMENTAL_SEARCH_PAGES: "2"
          RECHECK_PENDING_LIMIT: "20"
          FORK_NETWORK_ROOTS_PER_RUN: "30"
          FORK_NETWORK_PAGES_PER_ROOT: "5"
        run: npm run catalog:discover

      - name: Promote catalog-ready pending projects
        run: npm run catalog:promote-pending

      - name: Validate site
        run: npm run build

      - name: Commit discovery progress
        run: |
          if [ -z "$(git status --porcelain -- content/projects discovery/pending discovery/state.json)" ]; then
            echo "Discovery already current."
            exit 0
          fi
          git config user.name "ps2sp-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/projects discovery/pending discovery/state.json
          git commit -m "chore(catalog): advance PS2 discovery"
          git pull --rebase origin main
          git push
