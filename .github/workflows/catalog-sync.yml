name: Sync PS2 catalog

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/sync-github.mjs"
      - ".github/workflows/catalog-sync.yml"

permissions:
  contents: write

concurrency:
  group: ps2sp-catalog-write
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'johnson-cooper/PS2SP'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out catalog
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Synchronize one catalog shard
        env:
          GITHUB_TOKEN: ${{ secrets.PS2SP_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          SYNC_SHARDS: "24"
          SYNC_ALL: ${{ github.event_name == 'push' && 'true' || 'false' }}
          FORCE_REFRESH: ${{ github.event_name == 'push' && 'true' || 'false' }}
          MAX_SYNC_API_REQUESTS: "800"
          GITHUB_CORE_RATE_LIMIT_RESERVE: "120"
        run: npm run catalog:sync

      - name: Validate site
        run: npm run build

      - name: Commit catalog changes
        run: |
          if [ -z "$(git status --porcelain -- content/projects)" ]; then
            echo "Catalog already current."
            exit 0
          fi
          git config user.name "ps2sp-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/projects
          git commit -m "chore(catalog): synchronize project metadata"
          git pull --rebase origin main
          git push
