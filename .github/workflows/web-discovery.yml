name: Discover PS2 web resources

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/discover-web.mjs"
      - ".github/workflows/web-discovery.yml"

permissions:
  contents: write

concurrency:
  group: ps2sp-catalog-write
  cancel-in-progress: false

jobs:
  discover-web:
    if: github.repository == 'johnson-cooper/PS2SP'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Discover external PS2 resources
        run: npm run catalog:discover-web

      - name: Validate site
        run: npm run build

      - name: Commit web discovery progress
        run: |
          if [ -z "$(git status --porcelain -- data/resources/ps2dev-forum-live.json discovery/web-state.json)" ]; then
            echo "Web discovery already current."
            exit 0
          fi
          git config user.name "ps2sp-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/resources/ps2dev-forum-live.json discovery/web-state.json
          git commit -m "chore(catalog): advance PS2 web discovery"
          git pull --rebase origin main
          git push
