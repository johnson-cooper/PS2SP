name: Validate PS2SP

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate catalog scripts
        run: |
          node --check scripts/sync-github.mjs
          node --check scripts/discover-github.mjs
          node --check scripts/discover-web.mjs

      - name: Build static site
        run: npm run build

      - name: Enforce Cloudflare Pages asset limit
        run: |
          max_bytes=$((25 * 1024 * 1024))
          oversized="$(find dist -type f -size +${max_bytes}c -printf '%s %p\n' | sort -nr || true)"
          if [ -n "$oversized" ]; then
            echo "::error::Cloudflare Pages rejects individual assets larger than 25 MiB."
            echo "$oversized"
            exit 1
          fi

      - name: Inspect static output sizes
        run: |
          echo "Total dist size:"
          du -sh dist
          echo "File count:"
          find dist -type f | wc -l
          echo "Largest generated files:"
          find dist -type f -printf '%s %p\n' | sort -nr | head -20
          echo "Known heavy entrypoints:"
          for file in dist/projects/index.html dist/resources/index.html dist/api/resources.json dist/api/software.json dist/index.html; do
            if [ -f "$file" ]; then
              wc -c "$file"
            fi
          done
