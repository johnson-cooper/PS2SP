name: Discover PS2 external Git depth

# Almost every repository this scans lives on git.techwritescode.dev, the small personal server that hosts the
# PS2BUILD SDK. Run hourly (about five runs a day in practice), it could send that host up to 260 API requests
# a run, recursive tree listings included, for repositories that rarely change. So it runs once a week and
# attempts to check the current queue (EXTERNAL_GIT_REPOS_PER_RUN is above the 38 repositories queued on
# 2026-11-02); MAX_EXTERNAL_GIT_REQUESTS still caps the run, and a run that hits the cap resumes where it
# stopped the next week.
on:
  schedule:
    # Thursdays 16:57 UTC (8:57 AM Pacific standard time).
    - cron: "57 16 * * 4"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/discover-external-git.mjs"
      - "scripts/lib/external-git-client.mjs"
      - "scripts/tests/**"
      - "config/external-git-sources.json"
      - ".github/workflows/external-git-discovery.yml"

permissions:
  contents: write

concurrency:
  group: ps2sp-external-git
  cancel-in-progress: false

jobs:
  discover-external-git:
    if: github.repository == 'johnson-cooper/PS2SP'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Test catalog regressions
        run: npm test

      - name: Scan non-GitHub Git hosts
        env:
          MAX_EXTERNAL_GIT_REQUESTS: "260"
          EXTERNAL_GIT_REPOS_PER_RUN: "40"
          EXTERNAL_GIT_BRANCH_PAGES_PER_REPO: "2"
          EXTERNAL_GIT_FORK_PAGES_PER_REPO: "2"
          EXTERNAL_GIT_TREES_PER_RUN: "80"
          EXTERNAL_GIT_INTERNAL_PATHS_PER_BRANCH: "40"
        run: npm run catalog:discover-external-git

      - name: Validate site
        run: npm run build

      - name: Commit external Git discovery progress
        run: |
          if [ -z "$(git status --porcelain -- data/resources/external-git-live.json discovery/external-git-state.json)" ]; then
            echo "External Git discovery already current."
            exit 0
          fi
          git config user.name "ps2sp-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/resources/external-git-live.json discovery/external-git-state.json
          git commit -m "[CF-Pages-Skip] chore(catalog): advance external Git discovery"
          git pull --rebase origin main
          git push
